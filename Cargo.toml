[package]
name = "eletrolitic"
version = "0.1.0"
edition = "2024"
description = "TypeScript compiler powered by Rust"
license = "ISC"
repository = "https://github.com/BrunoCostaPrado/Eletrolitic"
keywords = ["typescript", "compiler", "rust"]
categories = ["development-tools", "compilers"]

[lib]
name = "eletrolitic"
crate-type = ["rlib"]

[[bin]]
name = "eletrolitic"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.5"
bincode = "1.3"
dirs = "5.0"
crc32fast = "1.3"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true