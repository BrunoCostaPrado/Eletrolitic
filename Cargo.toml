[package]
name = "eletrolitic"
version = "0.2.0"
edition = "2024"
description = "TypeScript compiler powered by Rust"
license = "ISC"
repository = "https://github.com/BrunoCostaPrado/Eletrolitic"
keywords = ["typescript", "compiler", "rust"]
categories = ["development-tools", "compilers"]

[lib]
name = "eletrolitic"
crate-type = ["rlib"]

[[bin]]
name = "eletrolitic"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.8"
bincode = { package = "bincode_reloaded", version = "3.1", features = ["serde"] }
dirs = "6.0"
crc32fast = "1.5"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true