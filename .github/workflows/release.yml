name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: ferrite
            platform: linux-x64
          - target: x86_64-apple-darwin
            os: macos-13
            bin: ferrite
            platform: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-14
            bin: ferrite
            platform: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: ferrite.exe
            platform: win32-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Strip debug symbols
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.bin }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Download each platform binary into its own subdir
      - uses: actions/download-artifact@v4
        with:
          name: binary-linux-x64
          path: npm/bin/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: binary-darwin-x64
          path: npm/bin/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: binary-darwin-arm64
          path: npm/bin/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: binary-win32-x64
          path: npm/bin/win32-x64
      - name: Ensure binaries are executable
        run: chmod +x npm/bin/linux-x64/* npm/bin/darwin-x64/* npm/bin/darwin-arm64/*
      - name: Build npm package
        working-directory: npm
        run: npm install && npm run build
      - name: Publish
        working-directory: npm
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
