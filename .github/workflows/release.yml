name: Release

# ================================================================
# TRUSTED PUBLISHING SETUP
# 
# This workflow publishes to npm using GitHub OIDC authentication.
# For trusted publishing to work, you MUST configure it on npmjs.com:
#   1. Go to: https://www.npmjs.com/package/eletrolitic/settings/manage
#   2. Edit "Trusted Publisher" → Add publisher:
#      Provider: GitHub
#      Repository: BrunoCostaPrado/eletrolitic
#      Workflow filename: release.yml
#      Accept publishing: checked
#   3. Save the configuration
# 
# Key requirements for this workflow:
#   • permissions: { id-token: write, attestations: write } 
#   • Must run on GitHub-hosted runners (not self-hosted)
#   • publishes with: npm publish --provenance --access public
# ================================================================

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  build:
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: eletrolitic
            platform: linux-x64
          - target: x86_64-apple-darwin
            os: macos-13
            bin: eletrolitic
            platform: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-14
            bin: eletrolitic
            platform: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: eletrolitic.exe
            platform: win32-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Strip debug symbols
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/${{ matrix.bin }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm OIDC trusted publishing
      attestations: write  # required for provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      # Download each platform binary into its own subdir
      - uses: actions/download-artifact@v4
        with:
          name: binary-linux-x64
          path: npm/bin/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: binary-darwin-x64
          path: npm/bin/darwin-x64
      - uses: actions/download-artifact@v4
        with:
          name: binary-darwin-arm64
          path: npm/bin/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: binary-win32-x64
          path: npm/bin/win32-x64
      - name: Ensure binaries are executable
        run: chmod +x npm/bin/linux-x64/* npm/bin/darwin-x64/* npm/bin/darwin-arm64/*
      - name: Build npm package
        working-directory: npm
        run: |
          rm -f package-lock.json
          npm cache clean --force
          npm install && npm run build
      - name: Publish (First time, using token)
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
